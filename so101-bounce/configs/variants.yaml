# Round 10 (2026-11-01): fitted to the real-ball runs. Servo set 12v_r10 (torque cap on the loaded joints: the real
# launch reached 0.45 m/s, 12v_r8 predicted 1.03); launch replay with the strike length the runner may adapt to (3-8
# steps); camera bias 2.5 cm, latency centred on the measured 62 ms (range to 120 ms), depth error growing with ball
# speed (motion blur at ~8 ms exposure), rare in-flight radius outliers, rolling-shutter timing; apex 9-14 cm (more
# time per hit for slow servos); a penalty for hitting with the face tilted more than 5 deg.
v16: &v16
  env: &v16env
    servo_variant: "12v_r10"
    act_delay_ms: [18.0, 5.0, 35.0]
    side_cam_prob: 0.0
    held_start_prob: 0.15
    flight_h: [0.03, 0.40]
    ceiling_after_land: true
    overhead_cam_box: [[-0.25, -0.20, 0.70], [0.45, 0.20, 1.30]]
    age_bias: 0.06
    depth_scale: 0.05
    cam_lat_max: 0.12
    overhead_cam: [-0.068, 0.012, 0.732]
    overhead_cam_box_p: 0.5
    cam_base_ms: [12.0, 5.0, 70.0]
    cam_noise_px: [0.0025, 0.001, 0.005]
    cam_bias: 0.025
    depth_speed_k: 0.005
    radius_outlier_p: 0.03
    rolling_shutter: 0.07
    start_pose_p: 0.3
    switch_delay_p: 0.5
    midbounce_p: 0.25
    hist_noise_p: 0.15
    rest_spread: 0.95
    level_error: 0.052
    rest_roll_p: 0.5
    toss_p: 0.35
    sidein_p: 0.25
    rest_start_prob: 0.5
    paddle_mass: [0.16, 0.08, 0.25]
    rubber_fullrange: true
    rubbers: [[0.40, [0.84, 0.92], [0.30, 0.60]], [0.15, [0.78, 0.86], [0.12, 0.30]], [0.10, [0.80, 0.88], [0.15, 0.35]],
              [0.05, [0.72, 0.82], [0.08, 0.20]], [0.30, [0.55, 0.75], [0.15, 0.45]]]
    w_first: 1.0
    w_wait: 1.0
    launch_replay_p: 0.6
    launch_jitter: 0.15
    launch_strike_range: [3, 8]
    view_top: [0.10, 0.14]
    view_top_p: 0.5
    beside_feasible: true
    beside_start_prob: 0.25
    beside_offset: [0.08, 0.16]
    toss_curriculum: true
    push_rate_hz: 1.0
    joint_offset: 0.05
    joint_offset_full_p: 0.3
    target_apex: [0.09, 0.14]
    w_tilt_contact: 0.2
v16_p32:
  env:
    <<: *v16env
    p_gain: 32.0
v16_p32_lo:
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
v16_p32_hi:
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.11, 0.15]
v16_p32_rl:
  env:
    <<: *v16env
    p_gain: 32.0
    launch_replay_p: 0.0
v16_p32_wide:
  env:
    <<: *v16env
    p_gain: 32.0
    servo_variant: "12v_r10w"
# Round 11 (2026-11-01): level error, hand taps, beside offsets and toss speed scaled with the task difficulty level,
# which stayed near 0.1 in round 10, so they were hardly trained. A share of episodes now draws them over the full range.
# Both start from v16-p32-lo's final (target 7-10 cm).
v17_p32_cal:            # joint calibration and paddle level up to 3 deg, hand taps up to 1 Hz
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    joint_offset: 0.052
    joint_offset_full_p: 0.6
    level_error: 0.052
    level_error_full_p: 0.6
    push_rate_hz: 1.0
    push_full_p: 0.5
v17_p32_reach:          # landing beside from 9-40 cm up, tosses within the reachable part (0.3 m/s, 15 rad/s)
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    beside_start_prob: 0.4
    beside_full_p: 0.6
    toss_p: 0.45
    toss_vlat: 0.3
    toss_spin: 15.0
    toss_full_p: 0.6
# Round 12 (2026-11-01): "get it bouncing from any angle; a higher first toss for momentum, harder flicks; low bounces
# need more control, so start high". Higher steered launch (bounce/launch.py NAMED "r12": paddle ~1.0 m/s, first
# bounce ~12.5 cm from centre, half-way or rim, rolling, tilted, dead paddle) replayed on resting starts; target
# starts at 15-18 cm for 1-2 s then ramps over 1 s to the steady 8-10 cm (70 % of episodes); paddle may rise 10 cm;
# more dead paddles. From v17-lo-cont (round-11 continuation of the deploy pick v16-p32-lo).
v18_p32_sched: &v18
  env: &v18env
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.08, 0.10]
    target_sched_p: 0.7
    target_start: [0.15, 0.18]
    target_high_s: [1.0, 2.0]
    target_ramp_s: 1.0
    launch_name: "r12"
    launch_steer: true
    launch_max_action: 2.0
    launch_replay_p: 0.6
    launch_strike_range: [4, 6]
    paddle_box: [0.12, 0.10]
    level_error_full_p: 0.3
    rubbers: [[0.30, [0.84, 0.92], [0.30, 0.60]], [0.12, [0.78, 0.86], [0.12, 0.30]], [0.08, [0.80, 0.88], [0.15, 0.35]],
              [0.05, [0.72, 0.82], [0.08, 0.20]], [0.45, [0.55, 0.75], [0.15, 0.45]]]
v18_p32_sched_wide:     # the strike length the runner's adaptation may settle on, wider
  env:
    <<: *v18env
    launch_strike_range: [3, 8]
    launch_jitter: 0.3
v18_p32_t12:            # comparison: a steady 12 cm target, no schedule
  env:
    <<: *v18env
    target_apex: [0.11, 0.13]
    target_sched_p: 0.0
v18_p32_sched_deep:     # the higher, drift-prone launch (dip 4 steps: ~15 cm)
  env:
    <<: *v18env
    launch_name: "r12_deep"
# Round 13 (2026-11-01): the runner's --auto-level (wrist trim from the ball's drift) in training, with an invisible
# paddle tilt (table tilt: gravity vs the base) up to 3 deg and joint calibration error up to 2 deg, each over the full
# range in half the episodes. From v16-p32-lo; v19_p32_tilt is the same without auto-level (control).
v19_p32_al:
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    auto_level: true
    table_tilt: 0.052
    table_tilt_full_p: 0.5
    joint_offset: 0.035
    joint_offset_full_p: 0.5
v19_p32_tilt:
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    table_tilt: 0.052
    table_tilt_full_p: 0.5
    joint_offset: 0.035
    joint_offset_full_p: 0.5
# Round 13b (2026-11-02): "the flicks should be harder to get it bouncing". The hard launch r13 (r12 / r12_deep retuned
# with a return stroke that brings the paddle back down toward home before the hand-off) replayed on most resting starts,
# at 60-105 % strength (a curriculum by mixture from gentler to the full flick), with the round-10 launch on the rest, so
# the policy learns the catch after it. From v16-p32-lo.
v20_p32_flick:
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    rest_start_prob: 0.6
    launch_replay_p: 0.9
    launch_mix: ["", "r13"]
    launch_mix_p: [0.3, 0.7]
    launch_scale_range: [0.6, 1.05]
    launch_steer: true
    launch_max_action: 2.0
    paddle_box: [0.12, 0.10]
# Round 14 (2026-11-02): "bouncing from any angle": train the starts the oracle found recoverable but v16-p32-lo misses:
# tosses aimed at the paddle (toward the centre or sideways) at up to 0.3 m/s (6 cm box) or 0.5 m/s (10 cm box, which the
# oracle needs for 0.5 m/s), spin up to 30 rad/s (tosses include near-zero speed, i.e. spinning centred drops), and hand
# taps at 0-1 Hz. In v16 the toss speed and spin scaled with a task level stuck near 0.1, so tosses were ~0.15 m/s and
# ~7 rad/s; toss_full_p draws the full range instead. From v16-p32-lo.
v21_p32_any6:
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    toss_p: 0.6
    toss_vlat: 0.3
    toss_spin: 30.0
    toss_full_p: 0.8
    push_full_p: 0.5
v21_p32_any10:
  env:
    <<: *v16env
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    toss_p: 0.6
    toss_vlat: 0.5
    toss_spin: 30.0
    toss_full_p: 0.8
    push_full_p: 0.5
    paddle_box: [0.12, 0.10]
# Round 15 (2026-11-02): servo set fitted to the real speed test plus the 2026-11-01 real-ball logs (12v_r11: ~3.3 N m
# torque cap, more rotor inertia; 12v_r10 had 1.75). On 12v_r11 the round-10 launch stroke lifts the paddle ~8 cm (real
# arm 10.5 cm), past the 6 cm paddle limit, so the limit is 10 cm as in v21_p32_any10. From v16-p32-lo.
v22_p32_r11:
  env:
    <<: *v16env
    servo_variant: "12v_r11"
    p_gain: 32.0
    target_apex: [0.07, 0.10]
    paddle_box: [0.12, 0.10]
# Round 15b (2026-11-02): the policy launches from rest by itself (no scripted launch replayed): 70 % resting starts,
# a ball coming down near paddle height more than 6 cm behind the paddle centre (on the handle) is lost, first-apex
# drift toward the handle costs w_back per m, restitution weighted to 0.55-0.75 (the user's new paddle is unmeasured,
# the old one ~0.6), 10 cm paddle limit. On the real arm the r10 flick threw the ball ~14 cm back onto the handle.
v23_p32_learn:          # from v18-p32-t12 (already launches itself), servo set 12v_r11
  env: &v23env
    <<: *v16env
    servo_variant: "12v_r11"
    p_gain: 32.0
    target_apex: [0.08, 0.12]
    paddle_box: [0.12, 0.10]
    launch_replay_p: 0.0
    rest_start_prob: 0.7
    handle_keepout: 0.06
    w_back: 10.0
    rubbers: [[0.15, [0.84, 0.92], [0.30, 0.60]], [0.10, [0.78, 0.86], [0.12, 0.30]], [0.15, [0.72, 0.82], [0.08, 0.20]],
              [0.60, [0.55, 0.75], [0.15, 0.45]]]
v23_p32_learn_w:        # the same on the wide servo set (r10 cap up to the speed-test fit)
  env:
    <<: *v23env
    servo_variant: "12v_r11w"
v23_p32_learn16:        # the same as v23_p32_learn, from v16-p32-lo
  env:
    <<: *v23env
# Round 16 (2026-11-04): the first real-arm test of v23-p32-learn16 bounced from dropped balls (up to 7 flights at
# ~10 cm, period ~0.3 s); its launches from rest did not, and the ball worked out to the blade edge. Drops only (the
# user drops from 17-30 cm), targets 14-20 cm so a drop needs little damping (and 1.25x the flight time at 16 cm), drops
# landing up to 10 cm off centre, and the real camera's top edge measured from those drops (22-30 cm above the blade,
# not 10-14). Scored on drop suites only. Resumed from v23-p32-learn16 with its best score reset.
v24_p32_drop16:
  train: &v24train
    eval_suites: [nominal, moderate, user_hw, full]
  env: &v24env
    <<: *v23env
    target_apex: [0.14, 0.20]
    rest_start_prob: 0.0
    flight_h: [0.12, 0.30]
    flight_spread: 0.10
    view_top: [0.20, 0.28]
v24_p32_dense:          # the same plus dense terms: each hit sends the ball at the velocity that reaches the target
  train: *v24train      # apex and lands back on the centre (w_aim), and the paddle stays under the ball's predicted
  env:                  # landing point in flight (w_track)
    <<: *v24env
    w_aim: 1.0
    w_track: 0.5
v24_p32_reach:          # dense terms plus reach: the arm chases balls landing anywhere on or off the blade. Pan
  train: &v24reachtrain # +-0.5 rad is ~+-17 cm at the paddle (was +-0.2, ~7 cm); wider paddle box and loss radius,
    eval_suites: [nominal, moderate, user_hw, full]
  ppo: &v24reachppo     # exploration: resumed at std 0.1 with an entropy bonus (since round 10 the std sat at the
    ent_coef: 0.002     # e^-5 clamp floor, 0.0067, so fine-tunes explored almost nothing)
  env: &v24reach        # weaker pull home, more and farther beside drops at full range, 60 % of drops over the whole
    <<: *v24env         # blade (the task level, stuck near 0.13, kept drops within ~3 cm of the centre); off-centre
    action_scale: [0.50, 0.45, 0.45, 0.35, 0.30]     # hits cost up to 1.0 at the rim (w_edge; a bigger w_hit would
    paddle_box: [0.22, 0.10]                         # pay low fast dribbles), rate and speed penalties halved; the
    max_lateral: 0.28                                # real overhead view from the 2026-11-04 calibration with the
    w_home: 0.2                                      # runner's search window widened to 0.20 m sideways and forward
    w_edge: 1.0                                      # (the true camera moved up to 2 cm / 2 deg). Resumed with the
    w_rate: 0.01                                     # actor rescaled (scripts/rescale_actions.py).
    w_qd: 0.005
    beside_start_prob: 0.4
    beside_offset: [0.08, 0.25]
    beside_full_p: 0.5
    drop_blade_p: 0.6
    flight_spread: 0.14
    w_aim: 1.0
    w_track: 1.0
    view_top_p: 0.0
    cam_view: [0.15837, -0.80796, 0.56755, -0.98726, -0.13863, 0.07814, 0.01554, -0.5727, -0.81962,
               -0.10595, 0.00106, 0.781, 521.67, 640, 480]
    cam_view_p: 0.9
    cam_view_half: 0.20
    cam_view_back: 0.14
v24_p32_reach_sparse:   # ablation: the same without the dense aim / track terms
  train: *v24reachtrain
  ppo: *v24reachppo
  env:
    <<: *v24reach
    w_aim: 0.0
    w_track: 0.0
# Round 17 (2026-11-05), from research/round16_critique.md: exploration had sat at the e^-5 clamp floor since round
# 10 (zero gradient, ent_coef 0), so fine-tunes learned nothing new; the std reset of round 16 decayed to 0.036 in 15
# min. Now a floor at std 0.05 and an entropy bonus. Apex reward width 6 cm (at 3 cm the 14-20 cm targets gave
# ~exp(-5) from the policy's ~10 cm), targets 12-20 cm, no wait penalty (drops), restitution re-centred on the new
# paddle's ~0.75-0.9 (bounce timing, 65 pairs), camera heights in flight scaled 0.7-1.0 (real ~0.79), scored at
# difficulty 0 / 0.25 / 0.5 (the difficulty-1 suites all scored 0).
v25_reach:
  train: &v25train
    eval_suites: [nominal, easy, moderate]
  ppo: &v25ppo
    ent_coef: 0.005
    min_log_std: -3.0
  env: &v25env
    <<: *v24reach
    apex_sigma: 0.06
    target_apex: [0.12, 0.20]
    w_wait: 0.0
    rubbers: [[0.30, [0.80, 0.92], [0.30, 0.60]], [0.25, [0.74, 0.86], [0.12, 0.30]], [0.25, [0.68, 0.80], [0.08, 0.20]],
              [0.20, [0.55, 0.72], [0.15, 0.45]]]
    cam_height_gain: [0.7, 1.0]
v25_reach_sparse:       # without the dense aim / track terms
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v25env
    w_aim: 0.0
    w_track: 0.0
v25_drop:               # the round-15 action range and search window (no reach widening), everything else as v25_reach
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v25env
    action_scale: [0.20, 0.30, 0.30, 0.35, 0.30]
    paddle_box: [0.12, 0.10]
    max_lateral: 0.18
    w_home: 0.5
    beside_offset: [0.08, 0.16]
    cam_view_half: 0.14
# Round 18 (2026-11-05): on the real arm the ball walked off the tip (39 of 51 tries lost > 8 cm forward, run
# 20261105-224314) and left centred hits sideways, while every sim imperfection was zero-mean, so an off-centre bounce
# drifted back to the middle and the policy never practised recovering or diving. Each episode now has a forward tip
# at every hit (the taped paddle pivots in the jaws: 0-3 deg, ~5 cm per bounce at 3 deg), a larger texture push, and
# big pushes in random directions mid-rally (0.15-0.6 m/s, landing 5-19 cm away) so the arm dives throughout; weaker
# pull home, stronger aim back to the centre and paddle-under-landing tracking. From v25-reach-3 (or v25-drop-2).
v26_reach:
  train: *v25train
  ppo: *v25ppo
  env: &v26env
    <<: *v25env
    impact_tip: [0.0, 0.05]
    kick_range: [0.03, 0.12]
    dive_p: 0.15
    dive_kick: [0.15, 0.6]
    w_home: 0.1
    w_aim: 2.0
    w_track: 2.0
v26_reach_dive30:       # twice the big pushes
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v26env
    dive_p: 0.3
v26_reach_wide:         # nearer the motor limits: pan +-0.7 rad, lift / elbow +-0.55, paddle box +-28 cm, search
  train: *v25train      # window +-26 cm (resumed with the actor rescaled from the reach range)
  ppo: *v25ppo
  env:
    <<: *v26env
    action_scale: [0.70, 0.55, 0.55, 0.35, 0.30]
    paddle_box: [0.28, 0.12]
    max_lateral: 0.35
    cam_view_half: 0.26
    beside_offset: [0.08, 0.30]
v26_reach_nodive:       # ablation: the forward tip and texture push only
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v26env
    dive_p: 0.0
v26_reach_r25:          # ablation: round-18 conditions with the round-17 reward weights
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v26env
    w_home: 0.2
    w_aim: 1.0
    w_track: 1.0
v26_drop:               # round-18 conditions on the round-15 action range (the policy run on the arm tonight)
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v26env
    action_scale: [0.20, 0.30, 0.30, 0.35, 0.30]
    paddle_box: [0.12, 0.10]
    max_lateral: 0.18
    w_home: 0.25
    beside_offset: [0.08, 0.16]
    cam_view_half: 0.14
# Round 18c (2026-11-05, from the measured real bounces of runs 20261105-224314 / 20261104-234427): the forward push
# follows the paddle's upward strike (dv ~ 0.45-0.8 x the paddle's speed), ~0 on a still paddle's first catch
# (impact_tip scaled with the ball's speed and pushed hardest there); the re-taped face barely steered the ball (tilt
# authority 0.3-1, so it also learns to steer with position); sideways texture ~0.07 m/s per axis; e 0.83-0.84;
# training saw off-centre states rarely (task level 0.06: floor 0.5); w_lateral 1.0 from home cost a flat 4/s for any
# far ball (0.3); beside drops within 15 cm; the overhead view as calibrated 2026-11-05 22:37.
v27_reach:
  train: *v25train
  ppo: *v25ppo
  env: &v27env
    <<: *v26env
    impact_tip: [0.0, 0.0]
    strike_push: [0.2, 0.9]
    tilt_authority: [0.3, 1.0]
    kick_range: [0.04, 0.10]
    adr_floor: [0.0, 0.0, 0.0, 0.5]
    w_lateral: 0.3
    beside_offset: [0.08, 0.15]
    rubbers: [[0.60, [0.78, 0.90], [0.20, 0.50]], [0.20, [0.72, 0.82], [0.12, 0.30]], [0.20, [0.84, 0.92], [0.30, 0.60]]]
    cam_view: [0.16264, -0.80792, 0.56641, -0.98668, -0.13463, 0.09128, 0.00251, -0.57371, -0.81905,
               -0.0876, -0.0086, 0.79816, 521.67, 640, 480]
v27_reach_wide:         # near the motor limits sideways (forward dives are capped by geometry and servo speed)
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v27env
    action_scale: [0.70, 0.55, 0.55, 0.35, 0.30]
    paddle_box: [0.28, 0.12]
    max_lateral: 0.30
    cam_view_half: 0.24
v27_reach_dive25:       # more big pushes mid-rally
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v27env
    dive_p: 0.25
v27_reach_tilt1:        # ablation: the face steers fully (tilt authority 1)
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v27env
    tilt_authority: [1.0, 1.0]
v27_drop:               # round-15 action range (the policy run on the arm tonight)
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v27env
    action_scale: [0.20, 0.30, 0.30, 0.35, 0.30]
    paddle_box: [0.12, 0.10]
    max_lateral: 0.18
    w_home: 0.25
    cam_view_half: 0.14
# Round 18d (2026-11-05): in round 18c bounces fell as dives rose (dive 25 %: 4.1 per episode, tilt-1: 6.3): half the
# big pushes went forward or back by up to 19 cm, where the arm cannot reach (~5-7 cm per flight), so every episode met
# an unrecoverable ball within ~6 bounces whatever the policy did. Big pushes now mostly sideways (forward/back part
# x0.3, at most ~5 cm) and 0.1-0.45 m/s (~3-14 cm). From the round-18c best checkpoints.
v28_reach:
  train: *v25train
  ppo: *v25ppo
  env: &v28env
    <<: *v27env
    dive_fwd: 0.3
    dive_kick: [0.1, 0.45]
v28_reach_wide:
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v28env
    action_scale: [0.70, 0.55, 0.55, 0.35, 0.30]
    paddle_box: [0.28, 0.12]
    max_lateral: 0.30
    cam_view_half: 0.24
v28_drop:
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v28env
    action_scale: [0.20, 0.30, 0.30, 0.35, 0.30]
    paddle_box: [0.12, 0.10]
    max_lateral: 0.18
    w_home: 0.25
    cam_view_half: 0.14
v28_reach_tilt1:        # the face steers fully
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v28env
    tilt_authority: [1.0, 1.0]
v28_reach_nodive:       # the measured rig only, no big pushes
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v28env
    dive_p: 0.0
v28_reach_soft:         # half-strength rig (strike 0.1-0.5, texture 0.02-0.07, tilt 0.6-1): is it learnable at all
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v28env
    strike_push: [0.1, 0.5]
    kick_range: [0.02, 0.07]
    tilt_authority: [0.6, 1.0]
# Round 18e (2026-11-06): round 18d plateaued from ~25 min (in their own worlds: soft 48-51 %, no-dive 16-19 %, the rest
# 3-11 %). The critic now sees each episode's hidden strike push, tilt authority, texture and tip (critic_rig), and the
# half-strength run moves up to the full rig (a two-step curriculum). Each from its round-18d line's best checkpoint.
v29_reach:
  train: *v25train
  ppo: *v25ppo
  env: &v29env
    <<: *v28env
    critic_rig: true
v29_reach_wide:
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v29env
    action_scale: [0.70, 0.55, 0.55, 0.35, 0.30]
    paddle_box: [0.28, 0.12]
    max_lateral: 0.30
    cam_view_half: 0.24
v29_drop:
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v29env
    action_scale: [0.20, 0.30, 0.30, 0.35, 0.30]
    paddle_box: [0.12, 0.10]
    max_lateral: 0.18
    w_home: 0.25
    cam_view_half: 0.14
v29_reach_nodive:
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v29env
    dive_p: 0.0
# Round 18f (2026-11-06): rounds 18d/18e plateaued from ~12-25 min whatever was changed (the critic seeing the hidden
# settings did not help). The policy saw 4 control steps (80 ms) and 4 detections (~130 ms), shorter than one bounce
# (0.31 s), so it could not see how its last hit went and had to play one average strategy for every episode's hidden
# strike push and tilt authority. Now 8 steps and 16 detections (~0.53 s, two bounces); widened from the round-18e
# checkpoints with scripts/widen_obs.py (old inputs at their new places, zero weights for the older ones).
v30_reach:
  train: *v25train
  ppo: *v25ppo
  env: &v30env
    <<: *v29env
    history: 8
    cam_k: 16
v30_reach_wide:
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v30env
    action_scale: [0.70, 0.55, 0.55, 0.35, 0.30]
    paddle_box: [0.28, 0.12]
    max_lateral: 0.30
    cam_view_half: 0.24
v30_reach_nodive:
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v30env
    dive_p: 0.0
v30_reach_k24:          # 24 detections (~0.8 s)
  train: *v25train
  ppo: *v25ppo
  env:
    <<: *v30env
    cam_k: 24
