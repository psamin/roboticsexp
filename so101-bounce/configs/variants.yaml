    servo_variant: "12v_r8"
    act_delay_ms: [18.0, 5.0, 35.0]
    side_cam_prob: 0.0
    held_start_prob: 0.15
    beside_start_prob: 0.15
    flight_h: [0.03, 0.40]
    ceiling_after_land: true
    overhead_cam_box: [[-0.25, -0.20, 0.70], [0.45, 0.20, 1.30]]
    age_bias: 0.06
    depth_scale: 0.05
    cam_lat_max: 0.15
    overhead_cam: [-0.068, 0.012, 0.732]
    overhead_cam_box_p: 0.5
    cam_base_ms: [15.0, 8.0, 80.0]
    start_pose_p: 0.3
    switch_delay_p: 0.5
    midbounce_p: 0.25
    hist_noise_p: 0.15
    rest_spread: 0.95
    level_error: 0.052
    push_rate_hz: 0.8
    rest_roll_p: 0.5
    toss_p: 0.35
    sidein_p: 0.25
    rest_start_prob: 0.5
    paddle_mass: [0.16, 0.08, 0.25]
    rubber_fullrange: true
    rubbers: [[0.40, [0.84, 0.92], [0.30, 0.60]], [0.15, [0.78, 0.86], [0.12, 0.30]], [0.10, [0.80, 0.88], [0.15, 0.35]],
