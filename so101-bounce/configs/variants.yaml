# Variants merged over configs/train.yaml. Run with: python scripts/train.py --variant <name> --out ...
base: {}
# Feetech factory P gain (LeRobot writes 16): roughly doubles servo bandwidth; deploy only if sysid shows no oscillation
p32:
  env:
    p_gain: 32.0
# Policy at 30 Hz (the C920's rate and the rate LeRobot loops are known to sustain)
hz30:
  env:
    ctrl_hz: 30.0
    substeps: 16
# Bigger network: 4x the parameters (still ~0.1 ms per decision on the Mac CPU)
big:
  ppo:
    hidden: [512, 512, 256]
# Longer memory: 12 control steps of joints/actions and 12 ball detections (helps infer delays and servo strength)
hist12:
  env:
    history: 12
    cam_k: 12
# Stiffer servo and 30 Hz together (both helped separately in round 3)
p32_hz30:
  env:
    p_gain: 32.0
    ctrl_hz: 30.0
    substeps: 16
# The user's arm: 12 V servos fitted to the real arm (bounce/servo.py SERVO_RANGES_12V), fitted command delay,
# overhead camera only (no side camera yet)
v12:
  env:
    servo_variant: "12v"
    act_delay_ms: [30.0, 8.0, 40.0]
    side_cam_prob: 0.0
v12_p32:
  env:
    servo_variant: "12v"
    act_delay_ms: [30.0, 8.0, 40.0]
    side_cam_prob: 0.0
    p_gain: 32.0
# Round 7: v12 plus every start and setup case research/scenarios_and_failures.md found missing: held-then-released
# balls, starts beside the paddle, drops up to 40 cm (ceiling only after landing), the overhead camera anywhere from
# behind the base to in front of the paddle at 0.7-1.3 m, paddle up to 2 deg off level, larger timestamp and depth
# errors, camera latency up to 150 ms, resting starts out to 90 % of the blade
v13:
  env:
    servo_variant: "12v"
    act_delay_ms: [30.0, 8.0, 40.0]
    side_cam_prob: 0.0
    held_start_prob: 0.15
    beside_start_prob: 0.15
    flight_h: [0.03, 0.40]
    ceiling_after_land: true
    overhead_cam_box: [[-0.25, -0.20, 0.70], [0.45, 0.20, 1.30]]
    level_error: 0.035
    age_bias: 0.06
    depth_scale: 0.05
    cam_base_ms: [20.0, 8.0, 80.0]
    cam_lat_max: 0.15
    rest_spread: 0.9
v13_p32:
  env:
    servo_variant: "12v"
    act_delay_ms: [30.0, 8.0, 40.0]
    side_cam_prob: 0.0
    held_start_prob: 0.15
    beside_start_prob: 0.15
    flight_h: [0.03, 0.40]
    ceiling_after_land: true
    overhead_cam_box: [[-0.25, -0.20, 0.70], [0.45, 0.20, 1.30]]
    level_error: 0.035
    age_bias: 0.06
    depth_scale: 0.05
    cam_base_ms: [20.0, 8.0, 80.0]
    cam_lat_max: 0.15
    rest_spread: 0.9
    p_gain: 32.0
# Round 8: v13 plus start-up variation as the real runner switches the policy on: arm not yet settled (paddle
# +-3 cm, +-3 deg, joints still moving up to 0.5 rad/s), the policy's first action up to 0.25 s after the ball
# starts (arm held still meanwhile), ball already mid-bounce, non-zero start history; camera nominal at the
# calibrated mount (half the episodes; the rest anywhere in the v13 box), latency nominal ~65 ms (measured 62 ms);
# dead stops anywhere on the blade, half of them rolling (up to 0.3 m/s) on a paddle up to 3 deg off level;
# tosses (up to 0.5 m/s sideways, 30 rad/s spin, thrown down up to 1.5 m/s), side-ins from beside or below the
# edge, hand taps up to 0.8 Hz; half the starts dead stops; hard, dead paddles (restitution down to 0.55, a fifth
# rubber type) at every difficulty, paddles up to 0.25 kg; reward for reaching the target height quickly
