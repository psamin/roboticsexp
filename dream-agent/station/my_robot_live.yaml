# One SO-101 on dream's control loop from a Mac, as a robot of your own (body: custom), with my_robot.py beside it.
#
# The live config: my_robot.yaml with custom.driver my_robot.py:Arm. The dry run (my_robot.yaml) first:
#   source ~/dream-env/bin/activate
#   dreamcli robot run --config ~/my_robot/my_robot.yaml --checkpoint dreamlabs/dream-1-beta --task "..." --dry-run
# Live, motors on, a run starts by moving the arm to `home` (where it rests):
#   dreamcli robot run --config ~/my_robot/my_robot_live.yaml --checkpoint dreamlabs/dream-1-beta --task "..."

body: custom

custom:
  driver: my_robot.py:Arm   # motors on: yours to run, hand on the power switch
  # dream's model of the SO-101 (six joints: the arm's five and the held joint6), the arm Dream-1 was recorded on.
  ik: so101_faas
  # The zero-shot embodiment dream's setup registers for so101_faas (already on the account; Dream Labs' base models).
  embodiment: praneeths14209/so101-faas

# The real arm plays the right arm (the docs' "On another arm"); its serial port (so101/env.sh FOLLOWER_PORT).
# home: one angle per so101_faas joint (6), radians: the arm at rest as the dry run read it.
# region: a box around the whole arm in the model's frame (the arm's base, joint1, sits at x 0.216, y 0.125; +x
# forward). It bounds every link, not only the hand (robots.config ArmConfig.region), so it has no back edge. Its other
# faces are the hand area this arm's own demonstrations used (the tool point at p1-p99: 31 cm forward, 23 cm right to
# 20 cm left, table to 18 cm up), with room to lift: at most 33 cm forward, 2-25 cm up. Dream clips the hand targets
# into it and holds the arm on a row that leaves it by more than 1 cm. (Nov 5: targets 41 cm out; 00:56, a back edge
# in front of the base folded the arm into itself.)
follower_r:
  can_channel: /dev/tty.usbmodem5B790811541
  home: [0.14, -1.71, 1.437, 0.765, -1.5708, 0.0]   # rest as read 2026-11-05 00:43, roll less ROLL_SHIFT_DEG
  region: {lo: [null, -0.12, 0.02], hi: [0.546, 0.345, 0.25]}
# No left arm: my_robot.py keeps it in memory at so101_faas's left rest pose (dream_ik.specs), gripper open.
follower_l:
  can_channel: parked
  home: [0.3409, -1.7104, 1.5285, 1.1724, -1.4119, 0.0]

# The zero-shot embodiment's roles: head = the overhead C920 (OpenCV 0, 16:9 as the model takes it), wrist_r = the
# arm's wrist camera (my_robot.WristCam: OpenCV 1 turned upright, fingers at the bottom, cropped to 16:9 rather than
# squashed), wrist_l = black (the parked arm's).
# The custom sources also load my_robot.py before dreamcli makes its client, so dream's IK gets this arm's usable joint
# ranges (my_robot.narrow_ik_limits).
cameras:
  - {name: head, device: 0, width: 1280, height: 720, fps: 30}
  - {name: wrist_r, source: my_robot.py:WristCam, width: 480, height: 270, fps: 30}
  - {name: wrist_l, source: my_robot.py:Black, width: 640, height: 480, fps: 30}

# Docs ("On another arm"): name only the right arm in the prompt.
task: "pick up the green bottle and put it on the plate with the right arm"

# dream's station rate for an SO-101 (robots.config SO101_CONTROL_HZ): the base model's 30 Hz rows at two thirds speed,
# "at 30 Hz the zero-shot base model swings the arm near home; at 20 Hz it runs smooth" (METAL_CONTROL_HZ). The beta
# robot table's 30 is the rate fine-tunes train at. 48 rows per reply, 9 frames at 5 fps.
control_hz: 20
action_horizon: 48
stale_after_s: 0.2
max_stall_ticks: 240
obs_window: 9
obs_fps: 5.0
# Above the 90th percentile of the hand speed the model planned on 2026-11-05 (0.41 m/s at 30 Hz, 0.27 at 20; dream's
# station default is 0.6): at 0.2 the arm lagged the plan on ~60 % of rows, and the model anchors each chunk on where
# the hand is.
max_ee_speed_m_s: 0.45
grip_force_cap: 0

# Save every run's chunks (what --view reads, and a record to review afterwards).
rollouts: {enabled: true}
